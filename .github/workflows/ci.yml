name: MyHeart CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - feat/azure-container-apps

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-test:
    name: Build, security checks and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate temporary CI secrets
        run: |
          umask 077

          printf 'MYSQL_ROOT_PASSWORD=%s\n' \
            "$(openssl rand -hex 32)" > .env

          printf 'JWT_SECRET=%s\n' \
            "$(openssl rand -hex 32)" >> .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for application readiness
        run: |
          for i in {1..60}; do
            if curl -fs --max-time 5 \
              http://localhost:4173/healthz \
              > /dev/null && \
              curl -fs --max-time 5 \
              http://localhost:4173/api/auth/test \
              > /dev/null && \
              curl -fs --max-time 5 \
              http://localhost:4173/api/catalog \
              > /dev/null; then

              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 3
          done

          echo "Application failed to become ready"
          exit 1

      - name: Verify running containers
        run: |
          docker compose ps -a

          running=$(docker compose ps \
            --status running --services | wc -l)

          if [ "$running" -ne 12 ]; then
            echo "Expected 12 running containers, found $running"
            exit 1
          fi

      - name: Test frontend
        run: curl -fs http://localhost:4173/

      - name: Test Nginx health endpoint
        run: curl -fs http://localhost:4173/healthz

      - name: Test authentication routing
        run: |
          curl -fs http://localhost:4173/api/auth/test

      - name: Test catalog routing
        run: |
          curl -fs http://localhost:4173/api/catalog > /dev/null

      - name: Verify backend network isolation
        run: |
          for port in {5000..5008}; do
            if timeout 2 bash -c \
              "echo > /dev/tcp/127.0.0.1/$port" 2>/dev/null; then

              echo "[FAIL] Port $port is accessible"
              exit 1
            else
              echo "[PASS] Port $port is not accessible"
            fi
          done

      - name: Verify backend health endpoints
        run: |
          declare -A services=(
            [api-gateway]=5000
            [auth-service]=5001
            [patient-service]=5002
            [doctor-service]=5003
            [appointment-service]=5004
            [consultation-records-service]=5005
            [lab-service]=5006
            [billing-service]=5007
            [catalog-service]=5008
          )

          for service in "${!services[@]}"; do
            port="${services[$service]}"

            docker compose exec -T "$service" node -e "
              fetch('http://127.0.0.1:$port/healthz')
                .then(r => process.exit(r.ok ? 0 : 1))
                .catch(() => process.exit(1))
            "

            echo "[PASS] $service health endpoint"
          done

      - name: Verify image environment security
        run: |
          services=(
            api-gateway
            auth-service
            patient-service
            doctor-service
            appointment-service
            consultation-records-service
            lab-service
            billing-service
            catalog-service
            frontend
          )

          for service in "${services[@]}"; do
            image=$(docker compose config --images "$service" | head -n 1)

            if [ -z "$image" ]; then
              echo "[FAIL] Image not found: $service"
              exit 1
            fi

            names=$(docker image inspect "$image" \
              --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | cut -d= -f1)

            if echo "$names" | grep -Eq \
              '^(DATABASE_URL|JWT_SECRET|MYSQL_ROOT_PASSWORD|MONGO_URI)$'; then

              echo "[FAIL] Sensitive variable embedded in $service"
              exit 1
            fi

            echo "[PASS] $service image configuration"
          done

      - name: Show container status on failure
        if: failure()
        run: docker compose ps -a

      - name: Cleanup test environment
        if: always()
        run: |
          docker compose down -v --remove-orphans
          rm -f .env