
services:
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: api-gateway
    expose:
      - "5000"
    environment:
      PORT: "5000"
      AUTH_SERVICE_URL: http://auth-service:5001
      PATIENT_SERVICE_URL: http://patient-service:5002
      DOCTOR_SERVICE_URL: http://doctor-service:5003
      APPOINTMENT_SERVICE_URL: http://appointment-service:5004
      CONSULTATION_SERVICE_URL: http://consultation-records-service:5005
      LAB_SERVICE_URL: http://lab-service:5006
      BILLING_SERVICE_URL: http://billing-service:5007
      CATALOG_SERVICE_URL: http://catalog-service:5008
    depends_on:
      - auth-service
      - patient-service
      - doctor-service
      - appointment-service
      - consultation-records-service
      - lab-service
      - billing-service
      - catalog-service

  auth-service:
    build:
      context: ./services/auth-service
    container_name: auth-service
    expose:
      - "5001"
    environment:
      PORT: "5001"
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?required}@mysql:3306/myheart_auth
      JWT_SECRET: ${JWT_SECRET:?required}
    depends_on:
      - mysql

  patient-service:
    build:
      context: ./services/patient-service
    container_name: patient-service
    expose:
      - "5002"
    environment:
      PORT: "5002"
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?required}@mysql:3306/myheart_patient
      JWT_SECRET: ${JWT_SECRET:?required}
      AUTH_SERVICE_URL: http://auth-service:5001
    depends_on:
      - mysql
      - auth-service

  doctor-service:
    build:
      context: ./services/doctor-service
    container_name: doctor-service
    expose:
      - "5003"
    environment:
      PORT: "5003"
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?required}@mysql:3306/myheart_doctor
      JWT_SECRET: ${JWT_SECRET:?required}
      AUTH_SERVICE_URL: http://auth-service:5001
    depends_on:
      - mysql
      - auth-service

  appointment-service:
    build:
      context: ./services/appointment-service
    container_name: appointment-service
    expose:
      - "5004"
    environment:
      PORT: "5004"
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?required}@mysql:3306/myheart_appointment
      JWT_SECRET: ${JWT_SECRET:?required}
      PATIENT_SERVICE_URL: http://patient-service:5002
      DOCTOR_SERVICE_URL: http://doctor-service:5003
      CONSULTATION_SERVICE_URL: http://consultation-records-service:5005
      BILLING_SERVICE_URL: http://billing-service:5007
      CATALOG_SERVICE_URL: http://catalog-service:5008
    depends_on:
      - mysql

  consultation-records-service:
    build:
      context: ./services/consultation-records-service
    container_name: consultation-records-service
    expose:
      - "5005"
    environment:
      PORT: "5005"
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?required}@mysql:3306/myheart_medical
      JWT_SECRET: ${JWT_SECRET:?required}
    depends_on:
      - mysql

  lab-service:
    build:
      context: ./services/lab-service
    container_name: lab-service
    expose:
      - "5006"
    environment:
      PORT: "5006"
      MONGO_URI: mongodb://mongodb:27017/myheart_lab
      JWT_SECRET: ${JWT_SECRET:?required}
      CATALOG_SERVICE_URL: http://catalog-service:5008
    volumes:
      - ./services/lab-service/uploads:/app/uploads
    depends_on:
      - mongodb

  billing-service:
    build:
      context: ./services/billing-service
    container_name: billing-service
    expose:
      - "5007"
    environment:
      PORT: "5007"
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?required}@mysql:3306/myheart_billing
      JWT_SECRET: ${JWT_SECRET:?required}
      CATALOG_SERVICE_URL: http://catalog-service:5008
    depends_on:
      - mysql

  catalog-service:
    build:
      context: ./services/catalog-service
    container_name: catalog-service
    expose:
      - "5008"
    environment:
      PORT: "5008"
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?required}@mysql:3306/myheart_catalog
      JWT_SECRET: ${JWT_SECRET:?required}
    depends_on:
      - mysql

  frontend:
    build:
      context: ./myheart-frontend
    container_name: myheart-frontend
    ports:
      - "127.0.0.1:4173:80"
    environment:
      API_GATEWAY_URL: http://api-gateway:5000
    volumes:
      - ./myheart-frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway


  mysql:
    image: mysql:8.0
    container_name: myheart-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init/mysql:/docker-entrypoint-initdb.d

  mongodb:
    image: mongo:7
    container_name: myheart-mongodb
    restart: always
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
    name: myheart-azure-dev-mysql-data
  mongo_data:

 
