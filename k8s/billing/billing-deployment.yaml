apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: myheart-billing-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5007
          envFrom:
            - configMapRef:
                name: billing-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: 5007
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5007
            initialDelaySeconds: 15
            periodSeconds: 10

